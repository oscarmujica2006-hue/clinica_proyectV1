<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubic Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/CSS/panel.css}">

</head>
<body>          
    <!-- Sidebar -->    
    <div class="sidebar" id="sidebar">
        <div class="logo">
            <div>
                <h1>PANEL</h1>
                <h1>Encargado Caja</h1>
            </div>
            <button class="toggle-btn" id="toggleBtn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <ul class="menu">

            <li onclick="loadPage('/caja/recibo/recibo-vista', '', 'reciboFrame', this)">
                <i class="fas fa-user-injured"></i>
                <span class="menu-text">Recibo</span>
            </li>

            <li onclick="loadPage('/caja/radiografia-pago/pago_radiografia', '', 'pagoRadiografiaFrame', this)">
                <i class="fas fa-user-injured"></i>
                <span class="menu-text">Pago Radiografía</span>
            </li>

            <li onclick="loadPage('/caja/recibos-estudiante/estudiante-recibo', 'estudiante Recibo', 'estudianteReciboFrame', this)">
                <i class="fas fa-user-injured"></i>
                <span class="menu-text">Recibos de Estudiantes</span>
            </li>



        </ul>
        <div class="user-info">
            <div class="user-avatar">HG</div>
            <div class="user-details">
                <div class="user-name">Hanna Gover</div>
            </div>
        </div>
    </div>
    
    <div class="main-content" id="mainContent">

        <div id="reciboContent" class="content-area">
            <iframe id="reciboFrame" src="about:blank"></iframe>
        </div>

        <div id="pagoRadiografiaContent" class="content-area">
            <iframe id="pagoRadiografiaFrame" src="about:blank"></iframe>
        </div>
        
        
        <div id="estudianteReciboContent" class="content-area">
            <iframe id="estudianteReciboFrame" src="about:blank"></iframe>
        </div>


    </div>

    <script>
        // Toggle sidebar
        const toggleBtn = document.getElementById('toggleBtn');
        const sidebar = document.getElementById('sidebar');
        
        toggleBtn.addEventListener('click', function() {
            sidebar.classList.toggle('collapsed');
        });

        function loadPage(pageUrl, pageTitle, frameId, menuItem) {
            console.log('Cargando:', pageUrl, 'en iframe:', frameId);
            
            // 1. Ocultar todos los contenidos
            document.querySelectorAll('.content-area').forEach(content => {
                content.classList.remove('active');
            });
            
            // 2. Desactivar todos los items del menú
            document.querySelectorAll('.menu li').forEach(item => {
                item.classList.remove('active');
            });
            
            // 3. Activar el item del menú clickeado
            if (menuItem) {
                menuItem.classList.add('active');
            }
            
            // 4. Determinar qué contenedor activar según el frameId
            let contentId = '';
            if (frameId === 'historiaClinicaFrame') {
                contentId = 'nuevoPacienteContent';
            }else if (frameId === 'reciboFrame') {
                contentId = 'reciboContent';
            }
            else if (frameId === 'estudianteReciboFrame') {
                contentId = 'estudianteReciboContent';
            }
            else if (frameId === 'pagoRadiografiaFrame') {
                contentId = 'pagoRadiografiaContent';
            }

            
            if (contentId) {
                document.getElementById(contentId).classList.add('active');
            } else {
                console.error('No se encontró contentId para frameId:', frameId);
                return;
            }
            
            // 5. Cargar la URL en el iframe
            const frame = document.getElementById(frameId);
            if (frame) {
                frame.src = pageUrl;
            } else {
                console.error('Iframe no encontrado:', frameId);
            }
            
            // 6. Opcional: actualizar título de la página si tienes un elemento para ello
            // document.getElementById('pageTitle').textContent = pageTitle;
        }

        // Cargar una página por defecto al iniciar (opcional)
        window.onload = function() {
            // Simular clic en el primer elemento del menú
            const firstMenuItem = document.querySelector('.menu li');
            if (firstMenuItem) {
                firstMenuItem.click();
            }
        };
    </script>
</body>
</html>
