<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" width="100%" role="img" aria-label="Diagrama de flujo de proceso de comercio electrónico">
  <defs>
    <style>
      .box { rx: 8; fill: #f8f9fa; stroke: #cbd5e1; stroke-width: 2; }
      .process { fill: #eff6ff; stroke: #3b82f6; }
      .decision { fill: #fef3c7; stroke: #f59e0b; }
      .start-end { fill: #f0fdf4; stroke: #22c55e; rx: 20; }
      .return { fill: #fef2f2; stroke: #ef4444; }
      .text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .small-text { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
  </defs>

  <!-- 1. Inicio -->
  <rect x="200" y="20" width="200" height="40" class="start-end" />
  <text x="300" y="40" class="text" font-weight="bold">1. Inicio: Cliente confirma compra</text>
  <path d="M 300 60 L 300 90" class="arrow" />

  <!-- 2. Proceso Pago -->
  <rect x="175" y="90" width="250" height="50" class="box process" />
  <text x="300" y="110" class="text" font-weight="bold">2. Procesar Pago (Tecnología)</text>
  <text x="300" y="128" class="small-text">Valida pasarela y transacciones</text>
  <path d="M 300 140 L 300 170" class="arrow" />

  <!-- 3. Decisión Pago -->
  <polygon points="300,170 380,215 300,260 220,215" class="decision" />
  <text x="300" y="210" class="text" font-weight="bold">3. ¿Pago aprobado?</text>
  
  <!-- No Pago -->
  <path d="M 220 215 L 130 215" class="arrow" />
  <text x="175" y="205" class="small-text" fill="#ef4444" font-weight="bold">No</text>
  <rect x="30" y="195" width="100" height="40" class="box return" />
  <text x="80" y="210" class="small-text" font-weight="bold">Notificar y finalizar</text>
  <text x="80" y="224" class="small-text">(Fin de proceso)</text>

  <!-- Sí Pago -->
  <path d="M 300 260 L 300 300" class="arrow" />
  <text x="312" y="280" class="small-text" fill="#22c55e" font-weight="bold">Sí</text>

  <!-- 4. Registrar pedido -->
  <rect x="175" y="300" width="250" height="50" class="box process" />
  <text x="300" y="320" class="text" font-weight="bold">4. Registrar pedido y stock (Comercial)</text>
  <text x="300" y="338" class="small-text">Área Comercial</text>
  <path d="M 300 350 L 300 380" class="arrow" />

  <!-- 5. Decisión Stock -->
  <polygon points="300,380 380,425 300,470 220,425" class="decision" />
  <text x="300" y="420" class="text" font-weight="bold">5. ¿Hay stock?</text>

  <!-- No Stock -->
  <path d="M 220 425 L 130 425" class="arrow" />
  <text x="175" y="415" class="small-text" fill="#ef4444" font-weight="bold">No</text>
  <rect x="30" y="405" width="100" height="40" class="box return" />
  <text x="80" y="420" class="small-text" font-weight="bold">Contactar proveedor</text>
  <text x="80" y="434" class="small-text">Ofrecer alternativa</text>

  <!-- Sí Stock -->
  <path d="M 300 470 L 300 510" class="arrow" />
  <text x="312" y="490" class="small-text" fill="#22c55e" font-weight="bold">Sí</text>

  <!-- 6. Logística -->
  <rect x="175" y="510" width="250" height="50" class="box process" />
  <text x="300" y="530" class="text" font-weight="bold">6. Empacar e inventario (Logística)</text>
  <text x="300" y="548" class="small-text">Seleccionar, empacar, actualizar</text>
  <path d="M 300 560 L 300 590" class="arrow" />

  <!-- 7. Transporte -->
  <rect x="175" y="590" width="250" height="50" class="box process" />
  <text x="300" y="610" class="text" font-weight="bold">7. Transportar y entregar (Repartidor)</text>
  <text x="300" y="628" class="small-text">Despacho a domicilio</text>
  <path d="M 300 640 L 300 670" class="arrow" />

  <!-- 8. Decisión Entrega -->
  <polygon points="300,670 380,715 300,760 220,715" class="decision" />
  <text x="300" y="710" class="text" font-weight="bold">8. ¿Recibe conforme?</text>

  <!-- No Entrega -->
  <path d="M 220 715 L 130 715" class="arrow" />
  <text x="175" y="705" class="small-text" fill="#ef4444" font-weight="bold">No</text>
  <rect x="30" y="695" width="100" height="40" class="box return" />
  <text x="80" y="710" class="small-text" font-weight="bold">Reprogramar</text>
  <text x="80" y="724" class="small-text">entrega</text>

  <!-- Sí Entrega -->
  <path d="M 300 760 L 300 800" class="arrow" />
  <text x="312" y="780" class="small-text" fill="#22c55e" font-weight="bold">Sí</text>

  <!-- 9. Factura -->
  <rect x="175" y="800" width="250" height="50" class="box process" />
  <text x="300" y="820" class="text" font-weight="bold">9. Factura y cierre (Administrativa)</text>
  <text x="300" y="838" class="small-text">Emitir factura electrónica y cerrar orden</text>
  <path d="M 300 850 L 300 880" class="arrow" />

  <!-- 10. Fin -->
  <rect x="200" y="880" width="200" height="40" class="start-end" />
  <text x="300" y="900" class="text" font-weight="bold">10. Fin: Pedido completado</text>
</svg>